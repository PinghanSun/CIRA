[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cira"
version = "0.1.0"
description = "Receiver-side adapter composition and budgeted continual adaptation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "Pillow>=10",
    "psutil>=5.9",
]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.0"]
plots = ["matplotlib>=3.8"]
export = ["onnx>=1.16,<2", "onnxscript>=0.1,<1"]
dev = ["ruff==0.12.12"]

[project.scripts]
cira = "softcas.paper_cli:main"
cira-runtime = "softcas.production:main"

[tool.setuptools.packages.find]
include = ["softcas*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["tests/coco_reference", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
